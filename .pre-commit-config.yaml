repos:
  # =========================
  # Terraform formatting
  # =========================
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
      - id: terraform_docs
        args:
          - --args=--lockfile=false

  # =========================
  # Security scanning
  # =========================
  - repo: https://github.com/aquasecurity/tfsec-pre-commit
    rev: v1.28.14
    hooks:
      - id: tfsec

  # =========================
  # 🧪 Terraform / Go tests
  # =========================
  - repo: local
    hooks:
      - id: terraform-go-tests
        name: terraform terratest
        entry: go test ./tests/...
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # =========================
  # General hygiene
  # =========================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: detect-private-key